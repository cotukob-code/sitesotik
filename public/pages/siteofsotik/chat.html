<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>СайтСотика — Чат</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; }
    .page-shell { max-width: 1200px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; margin-bottom: 20px; }
    .header-title { font-size: 24px; font-weight: bold; color: #00ffcc; }
    .header-sub { font-size: 14px; color: #888; }
    .content { display: flex; gap: 20px; flex: 1; }
    .panel { flex: 1; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
    .panel-stream .stream-box { position: relative; padding-top: 56.25%; background: #000; border-radius: 12px; overflow: hidden; }
    .panel-stream video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .panel-chat { display: flex; flex-direction: column; }
    .chat-title { padding: 15px; background: #1a1a1a; font-size: 16px; font-weight: 600; border-bottom: 1px solid #333; }
    .chat-box { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    .name-setup { display: flex; gap: 10px; margin-bottom: 10px; }
    .name-setup input { flex: 1; padding: 10px; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #fff; }
    .name-setup button { padding: 10px 15px; background: #00ffcc; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .chat-messages { flex: 1; display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; padding: 10px; background: #1a1a1a; border-radius: 8px; }
    .message { padding: 8px 12px; background: #2a2a2a; border-radius: 6px; font-size: 14px; word-wrap: break-word; }
    .bank-tabs { display: none; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
    .bank-tab { padding: 8px 12px; background: #333; color: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .bank-tab:hover { background: #00ffcc; color: #000; }
    #donateContent { margin: 10px 0; }
    .donate-form { padding: 15px; background: #1a1a1a; border-radius: 8px; border: 1px solid #333; }
    .donate-form h4 { margin-bottom: 10px; color: #00ffcc; }
    .donate-form input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #fff; }
    .donate-form button { padding: 10px 15px; background: #00ffcc; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .chat-input { display: flex; gap: 10px; align-items: center; }
    .chat-input label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #888; }
    .chat-input input[type="text"] { flex: 1; padding: 10px; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #fff; }
    .chat-input button { padding: 10px 15px; background: #00ffcc; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .bg-orbit, .bg-grid, .bg-lines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
    .bg-grid { background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px); background-size: 50px 50px; opacity: 0.2; }
    .bg-lines { background: repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(0,255,204,0.05) 20px, rgba(0,255,204,0.05) 40px); opacity: 0.3; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="bg-orbit"></div>
<div class="bg-grid"></div>
<div class="bg-lines"></div>

<div class="page-shell">

  <header class="header">
    <div class="header-left">
      <div class="header-title">СайтСотика</div>
      <div class="header-sub">стрим · чатик · страницы</div>
    </div>
    <nav class="header-nav">
      <a href="#">Главная</a>
      <a href="#">Обо мне</a>
      <a href="#">Игры</a>
      <a href="#">Команда</a>
      <a href="#">Партнёры</a>
    </nav>
  </header>

  <main class="content">

    <section class="panel panel-stream">
      <div class="stream-title">стрим</div>
      <div class="stream-box">
        <video src="" controls autoplay muted></video>
      </div>
    </section>

    <section class="panel panel-chat">
      <div class="chat-title">чатиксотика</div>

      <div class="chat-box">

        <div id="nameSetup" class="name-setup">
          <input id="nameInput" type="text" placeholder="Введите НИК или ИМЯ и ФАМИЛИЮ">
          <button onclick="saveName()">OK</button>
        </div>

        <div class="chat-messages" id="chat"></div>

        <div id="bankTabs" class="bank-tabs">
          <div class="bank-tab" onclick="toggleDonateContent('Сбер')">Сбер</div>
          <div class="bank-tab" onclick="toggleDonateContent('Т‑Банк')">Т‑Банк</div>
          <div class="bank-tab" onclick="toggleDonateContent('ВТБ')">ВТБ</div>
          <div class="bank-tab" onclick="toggleDonateContent('ЮMoney')">ЮMoney</div>
        </div>

        <div id="donateContent"></div>

        <div class="chat-input">
          <label>
            <input type="checkbox" id="donateFlag" onchange="toggleBanks()">
            донат
          </label>
          <input id="msg" type="text" placeholder="Введите сообщение..." disabled>
          <button onclick="sendMsg()" disabled>OK</button>
        </div>

      </div>
    </section>

  </main>

</div>
  <script src="script.js"></script>
</body>
</html>
